<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/ejercicio6.css">
    <link href='http://fonts.googleapis.com/css?family=Lato:300,400' rel='stylesheet' type='text/css'>  
    <title>Shopping Cart</title>
  </head>
  <body>
     <!-- Enlace de vuelta a la página index que he llamado ejercicio7.html--> 
     <button onclick="window.location.href='ejercicio7.html'">Volver al Índice</button>
      <h1> Solent Online Store</h1>  
      <h2 class="sub-heading">Free shipping for orders over 100€!</h2>
      <div id="cart-items" class="grid">
    <form id="productForm">
      <section class="product_list">
          <div class="product">   
              <div class="_column" >
                        <p>Milk Tray (€5) </p>
                        <img src="img/milk_tray.jpg"> 
             </div>
              <div class="_column topPadding">
                      <label>Add to cart</label><input type="checkbox" name="product" value="mt" class="product-check" data-price="5">  
             </div>
              <div class="_column topPadding">
                        <input type="number" value="1" name="mt-quantity" class="product-quantity" min="1"> 
             </div>
            <div class="_column topPaddingTotal">
                 <p>Total: <span class="product-total" id="mt-total"> €0 </span> </p>
            </div>  
          </div> 
          
          <div class="product">   
              <div class="_column" >
                        <p>Blender (€25) </p>
                        <img src="img/blender.jpg"> 
             </div>
              <div class="_column topPadding">
                      <label>Add to cart</label><input type="checkbox" name="product" value="blender" class="product-check" data-price="25">  
             </div>
              <div class="_column topPadding">
                        <input type="number" value="1" name="blender-quantity" class="product-quantity" min="1"> 
             </div>    
              <div class="_column topPaddingTotal">
                 <p>Total: <span class="product-total" id="blender-total"> €0 </span> </p>
             </div>    
          </div> 
          
          <div class="product">   
              <div class="_column" >
                        <p>Nike T (€25) </p>
                        <img src="img/nike_tshirt.jpg"> 
             </div> 
              <div class="_column topPadding">
                      <label>Add to cart</label><input type="checkbox" name="product" value="tshirt" class="product-check" data-price="25">  
             </div> 
              <div class="_column topPadding">
                        <input type="number" value="1" name="tshirt-quantity" class="product-quantity" min="1"> 
             </div>  
             <div class="_column topPaddingTotal">
                 <p>Total: <span class="product-total" id="tshirt-total"> €0 </span> </p>
             </div>   
          </div> 
          
            <div class="product">   
              <div class="_column" >
                        <p>Orb (€100) </p>
                        <img src="img/orb.jpg"> 
             </div> 
              <div class="_column topPadding">
                      <label>Add to cart</label><input type="checkbox" name="product" value="orb" class="product-check" data-price="100">  
             </div> 
              <div class="_column topPadding">
                        <input type="number" value="1" name="orb-quantity" class="product-quantity" min="1"> 
             </div>     
              <div class="_column topPaddingTotal">
                 <p>Total: <span class="product-total" id="orb-total"> €0 </span> </p>
             </div>    
          </div> 
      </section> 
      <div class="summary"> 
           <p class="cart-totals-key">Sub Total</p> 
           <div class="cart-totals-value" id="sub-total">€0.00</div>
          <p class="cart-totals-key">Shipping</p>
          <p class="cart-totals-value" id="shipping">€0.00</p>
          <p class="cart-totals-key">Taxes (20%)</p>
          <p class="cart-totals-value" id="taxes">€0.00</p>
          <p class="cart-totals-key">Total</p> 
          <p class="cart-totals-value" id="total">€0.00</p>
          <input type="submit" value="Checkout" class="bttn">
      </div>  
      </div> 
    </form>  
  <script defer src="js/ejercicio6.js"></script>  
 </body>
</html>
