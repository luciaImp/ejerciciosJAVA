<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Libros</title>
    <link rel="stylesheet" href="css/ejercicio5.css">
</head>
<body>
    <div class="container">
        <header>
            <button class="back-button" onclick="window.location.href='ejercicio7.html'">← Volver al Índice</button>
            <h1>Gestor de Libros</h1>
        </header>
        <main>
            <section class="book-form">
                <h2>Agregar un nuevo libro</h2>
                <form id="book-form">
                    <input type="text" id="book-title" placeholder="Título del libro" required>
                    <button type="submit">Agregar</button>
                </form>
            </section>
            <section class="book-list">
                <h2>Lista de Libros</h2>
                <ul id="book-list"></ul>
            </section>
        </main>
    </div>
    <script src="js/ejercicio5.js"></script>
</body>
</html>
