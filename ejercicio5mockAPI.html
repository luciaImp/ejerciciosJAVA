<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Libros</title>
    <link rel="stylesheet" href="css/ejercicio5mockAPI.css">
</head>
<body>
    <header>
        <button class="back-button" onclick="window.location.href='ejercicio7.html'">← Volver al Índice</button>
    </header>
    <div class="container">
        <h1>Mi Biblioteca</h1>
        
        <form id="bookForm">
            <h2>Añadir Nuevo Libro</h2>
            <input type="text" id="title" placeholder="Título del libro" required>
            <input type="text" id="author" placeholder="Autor" required>
            <button type="submit">Añadir Libro</button>
        </form>

        <div class="books-section">
            <h2>Lista de Libros</h2>
            <ul id="booksList"></ul>
        </div>
    </div>

    <script src="js/ejercicio5mockAPI.js"></script>
</body>
</html>
